name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: buyer-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buyer-security:
    permissions:
      contents: read
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build isolated validation tools
        env:
          IMAGE: blakdna-buyer-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker build --provenance=false -f Dockerfile.validation -t "$IMAGE" .
      - name: Validate buyer artifacts
        env:
          IMAGE: blakdna-buyer-ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          docker run --name "$IMAGE-checks" -e "BLAKDNA_SOURCE_COMMIT=$GITHUB_SHA" "$IMAGE" 2>&1 | tee buyer-validation.log
      - name: Collect scanner evidence
        if: always()
        env:
          IMAGE: blakdna-buyer-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker cp "$IMAGE-checks:/validation/reports" ./reports
      - name: Upload scanner SARIF
        if: always() && hashFiles('reports/sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939
        with:
          sarif_file: reports/sarif
      - name: Scan complete public history
        env:
          IMAGE: blakdna-buyer-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --rm --name "$IMAGE-history" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.git,target=/validation/.git,readonly" \
            "$IMAGE" sh -c 'git config --global --add safe.directory /validation; gitleaks git . --redact --no-banner'
      - name: Retain validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buyer-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            buyer-validation.log
            reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove only this job's resources
        if: always()
        env:
          IMAGE: blakdna-buyer-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$IMAGE-checks" "$IMAGE-history" 2>/dev/null || true
          docker image rm "$IMAGE" 2>/dev/null || true
