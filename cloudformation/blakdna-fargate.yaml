AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Buyer-owned blakDNA on ECS Fargate with private tasks, encrypted RDS PostgreSQL,
  Secrets Manager, HTTPS ALB, access logs, health alarms, and AWS Marketplace licensing.

Parameters:
  ContainerImage:
    Type: String
    Description: Immutable AWS Marketplace ECR image digest.
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/.+@sha256:[a-f0-9]{64}$"
  VpcId: { Type: "AWS::EC2::VPC::Id" }
  VpcCidr: { Type: String, Default: 10.42.0.0/16 }
  PublicSubnetIds: { Type: "List<AWS::EC2::Subnet::Id>", Description: Two public subnets for the ALB. }
  ApplicationSubnetIds: { Type: "List<AWS::EC2::Subnet::Id>", Description: Two private subnets with NAT egress for Fargate. }
  DataSubnetIds: { Type: "List<AWS::EC2::Subnet::Id>", Description: Two isolated subnets for PostgreSQL. }
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/.+$"
  ApplicationHostname: { Type: String, AllowedPattern: "^[a-z0-9][a-z0-9.-]+[a-z0-9]$" }
  Route53ZoneId: { Type: "AWS::Route53::HostedZone::Id" }
  HermesBaseUrl: { Type: String, AllowedPattern: "^https://.+$" }
  RuntimeSecretArn: { Type: String, Description: Buyer-managed JSON runtime secret. }
  RuntimeSecretKmsKeyArn: { Type: String, Default: "", Description: Optional specific customer-managed key protecting RuntimeSecretArn. }
  ServicesEnabled: { Type: String, AllowedValues: ["false", "true"], Default: "false" }
  SmtpRelayCidr:
    Type: String
    Description: Approved IPv4 SMTP relay network; keep aligned with SMTP_HOST.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([89]|[12][0-9]|3[0-2])$'
  AllowedIngressCidr: { Type: String, Default: 127.0.0.1/32 }
  AllowInternetIngress: { Type: String, AllowedValues: ["false", "true"], Default: "false" }
  DatabaseInstanceClass: { Type: String, Default: db.t4g.micro }
  DatabaseDeletionProtection: { Type: String, AllowedValues: ["false", "true"], Default: "true" }
  LoadBalancerDeletionProtection: { Type: String, AllowedValues: ["false", "true"], Default: "true" }
  AlarmNotificationEmail: { Type: String, Default: "" }

Rules:
  InternetIngressAcknowledged:
    RuleCondition: !Equals [!Ref AllowedIngressCidr, 0.0.0.0/0]
    Assertions:
      - Assert: !Equals [!Ref AllowInternetIngress, "true"]
        AssertDescription: World-open ingress requires AllowInternetIngress=true.

Conditions:
  EnableServices: !Equals [!Ref ServicesEnabled, "true"]
  HasRuntimeKey: !Not [!Equals [!Ref RuntimeSecretKmsKeyArn, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "true"]
  ProtectLoadBalancer: !Equals [!Ref LoadBalancerDeletionProtection, "true"]

Resources:
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: blakDNA buyer data, secrets, logs, and alarms
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: ["kms:Decrypt", "kms:Encrypt", "kms:GenerateDataKey*", "kms:ReEncrypt*", "kms:DescribeKey"]
            Resource: "*"
            Condition:
              ArnLike: { "kms:EncryptionContext:aws:logs:arn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*" }
          - Sid: SnsAlarms
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: ["kms:Decrypt", "kms:GenerateDataKey*"]
            Resource: "*"
            Condition: { StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" } }
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties: { AliasName: alias/blakdna-buyer, TargetKeyId: !Ref DataKey }

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted HTTPS ingress to blakDNA
      VpcId: !Ref VpcId
      SecurityGroupIngress: [{ Description: HTTPS, IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedIngressCidr }]
      Tags: [{ Key: Name, Value: blakdna-buyer-alb }]
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private blakDNA tasks
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: blakdna-buyer-tasks }]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private PostgreSQL from blakDNA tasks
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: blakdna-buyer-database }]
  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { Description: ALB to web task, GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, DestinationSecurityGroupId: !Ref TaskSecurityGroup }
  TaskFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { Description: ALB to web task, GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSecurityGroup }
  TaskHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    #trivy:ignore:AVD-AWS-0104 Fargate needs outbound TLS for Marketplace ECR, License Manager, Secrets Manager, and buyer Hermes.
    Properties: { Description: AWS APIs and buyer Hermes endpoint, GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  TaskDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { Description: VPC DNS over UDP, GroupId: !Ref TaskSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  TaskSmtpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { Description: Buyer-configured implicit TLS SMTP relay, GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 465, ToPort: 465, CidrIp: !Ref SmtpRelayCidr }
  TaskDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { Description: VPC DNS over TCP, GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  TaskToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { Description: PostgreSQL TLS, GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup }
  DatabaseFromTaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { Description: PostgreSQL from tasks, GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TaskSecurityGroup }

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: RDS credential managed inside buyer account
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username":"blakdnaadmin"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated blakDNA database subnets
      SubnetIds: !Ref DataSubnetIds
  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: blakDNA PostgreSQL TLS enforcement
      Family: postgres16
      Parameters: { rds.force_ssl: "1" }
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: blakdna-buyer-postgres
      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: blakdna
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !GetAtt DataKey.Arn
      PubliclyAccessible: false
      MultiAZ: true
      DeletionProtection: !If [ProtectDatabase, true, false]
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt DataKey.Arn
      EnableIAMDatabaseAuthentication: true
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DatabaseMonitoringRole.Arn
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]

  DatabaseMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: monitoring.rds.amazonaws.com }, Action: "sts:AssumeRole" }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole"]

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: blakdna-buyer
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /ecs/blakdna-buyer/web, RetentionInDays: 365, KmsKeyId: !GetAtt DataKey.Arn }
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /ecs/blakdna-buyer/worker, RetentionInDays: 365, KmsKeyId: !GetAtt DataKey.Arn }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
      Policies:
        - PolicyName: RuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: "secretsmanager:GetSecretValue", Resource: [!Ref DatabaseSecret, !Ref RuntimeSecretArn] }
              - { Effect: Allow, Action: "kms:Decrypt", Resource: !GetAtt DataKey.Arn }
              - !If [HasRuntimeKey, { Effect: Allow, Action: "kms:Decrypt", Resource: !Ref RuntimeSecretKmsKeyArn }, !Ref "AWS::NoValue"]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: MarketplaceLicense
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AwsMarketplaceContainerLicense
                Effect: Allow
                Action: [license-manager:CheckoutLicense, license-manager:GetLicense, license-manager:CheckInLicense, license-manager:ExtendLicenseConsumption, license-manager:ListReceivedLicenses]
                Resource: "*"

  #trivy:ignore:AVD-AWS-0132 ALB access-log delivery supports SSE-S3, not SSE-KMS.
  AlbLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Terminal access-log destination; independent audit logging requires a buyer-approved integration.
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules: [{ Id: ExpireAccessLogs, Status: Enabled, ExpirationInDays: 90, NoncurrentVersionExpiration: { NoncurrentDays: 7 } }]
  AlbLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLoadBalancerLogDelivery
            Effect: Allow
            Principal: { Service: logdelivery.elasticloadbalancing.amazonaws.com }
            Action: "s3:PutObject"
            Resource: !Sub "${AlbLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition: { StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" } }
          - Sid: AllowLoadBalancerAclCheck
            Effect: Allow
            Principal: { Service: logdelivery.elasticloadbalancing.amazonaws.com }
            Action: "s3:GetBucketAcl"
            Resource: !GetAtt AlbLogBucket.Arn
  #trivy:ignore:AVD-AWS-0053 Buyer UI intentionally uses a public ALB protected by explicit CIDRs, TLS, and WAF.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbLogBucketPolicy
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: deletion_protection.enabled, Value: !If [ProtectLoadBalancer, "true", "false"] }
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AlbLogBucket }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: "30" }]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  ApplicationDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53ZoneId
      Name: !Ref ApplicationHostname
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: blakdna-buyer
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 10
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { Name: AWSManagedRulesCommonRuleSet, VendorName: AWS }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: blakdna-buyer-common, SampledRequestsEnabled: true }
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 20
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { Name: AWSManagedRulesKnownBadInputsRuleSet, VendorName: AWS }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: blakdna-buyer-known-bad-inputs, SampledRequestsEnabled: true }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: blakdna-buyer, SampledRequestsEnabled: true }
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: { ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt WebAcl.Arn }
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: aws-waf-logs-blakdna-buyer, RetentionInDays: 365, KmsKeyId: !GetAtt DataKey.Arn }
  WebAclLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      LogDestinationConfigs: [!GetAtt WafLogGroup.Arn]
      ResourceArn: !GetAtt WebAcl.Arn
      RedactedFields: [{ SingleHeader: { Name: authorization } }]

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: blakdna-buyer-web
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: web
          Image: !Ref ContainerImage
          Essential: true
          ReadonlyRootFilesystem: true
          User: "1001"
          LinuxParameters: { InitProcessEnabled: true, Capabilities: { Drop: [ALL] } }
          PortMappings: [{ Name: http, ContainerPort: 3000, HostPort: 3000, Protocol: tcp, AppProtocol: http }]
          Environment:
            - { Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_PORT, Value: "5432" }
            - { Name: DATABASE_NAME, Value: blakdna }
            - { Name: DATABASE_USER, Value: blakdnaadmin }
            - { Name: DATABASE_SSLMODE, Value: require }
            - { Name: BETTER_AUTH_URL, Value: !Sub "https://${ApplicationHostname}" }
            - { Name: SMTP_PORT, Value: "465" }
            - { Name: HERMES_BASE_URL, Value: !Ref HermesBaseUrl }
            - { Name: HOSTNAME, Value: 0.0.0.0 }
          Secrets:
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub "${DatabaseSecret}:password::" }
            - { Name: BETTER_AUTH_SECRET, ValueFrom: !Sub "${RuntimeSecretArn}:BETTER_AUTH_SECRET::" }
            - { Name: BLAKDNA_ENCRYPTION_KEY, ValueFrom: !Sub "${RuntimeSecretArn}:BLAKDNA_ENCRYPTION_KEY::" }
            - { Name: HERMES_API_TOKEN, ValueFrom: !Sub "${RuntimeSecretArn}:HERMES_API_TOKEN::" }
            - { Name: SMTP_HOST, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_HOST::" }
            - { Name: SMTP_FROM, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_FROM::" }
            - { Name: SMTP_USER, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_USER::" }
            - { Name: SMTP_PASSWORD, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_PASSWORD::" }
            - { Name: BLAKDNA_NOTIFICATION_SMTP_HOSTS, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_HOST::" }
          HealthCheck:
            Command: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref WebLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: web }
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: blakdna-buyer-worker
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ContainerImage
          Essential: true
          Command: [node, dist/worker.cjs]
          ReadonlyRootFilesystem: true
          User: "1001"
          LinuxParameters: { InitProcessEnabled: true, Capabilities: { Drop: [ALL] } }
          Environment:
            - { Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_PORT, Value: "5432" }
            - { Name: DATABASE_NAME, Value: blakdna }
            - { Name: DATABASE_USER, Value: blakdnaadmin }
            - { Name: DATABASE_SSLMODE, Value: require }
            - { Name: BETTER_AUTH_URL, Value: !Sub "https://${ApplicationHostname}" }
            - { Name: SMTP_PORT, Value: "465" }
            - { Name: HERMES_BASE_URL, Value: !Ref HermesBaseUrl }
          Secrets:
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub "${DatabaseSecret}:password::" }
            - { Name: BETTER_AUTH_SECRET, ValueFrom: !Sub "${RuntimeSecretArn}:BETTER_AUTH_SECRET::" }
            - { Name: BLAKDNA_ENCRYPTION_KEY, ValueFrom: !Sub "${RuntimeSecretArn}:BLAKDNA_ENCRYPTION_KEY::" }
            - { Name: HERMES_API_TOKEN, ValueFrom: !Sub "${RuntimeSecretArn}:HERMES_API_TOKEN::" }
            - { Name: SMTP_HOST, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_HOST::" }
            - { Name: SMTP_FROM, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_FROM::" }
            - { Name: SMTP_USER, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_USER::" }
            - { Name: SMTP_PASSWORD, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_PASSWORD::" }
            - { Name: BLAKDNA_NOTIFICATION_SMTP_HOSTS, ValueFrom: !Sub "${RuntimeSecretArn}:SMTP_HOST::" }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: worker }
  WebService:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, Database]
    Properties:
      ServiceName: blakdna-buyer-web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !If [EnableServices, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration: { DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration:
        AwsvpcConfiguration: { AssignPublicIp: DISABLED, SecurityGroups: [!Ref TaskSecurityGroup], Subnets: !Ref ApplicationSubnetIds }
      LoadBalancers: [{ TargetGroupArn: !Ref TargetGroup, ContainerName: web, ContainerPort: 3000 }]
  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: Database
    Properties:
      ServiceName: blakdna-buyer-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !If [EnableServices, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration: { DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration:
        AwsvpcConfiguration: { AssignPublicIp: DISABLED, SecurityGroups: [!Ref TaskSecurityGroup], Subnets: !Ref ApplicationSubnetIds }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties: { KmsMasterKeyId: !GetAtt DataKey.Arn }
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties: { TopicArn: !Ref AlarmTopic, Protocol: email, Endpoint: !Ref AlarmNotificationEmail }
  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: blakDNA has an unhealthy web target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: blakDNA PostgreSQL free storage is below 2 GiB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

Outputs:
  PreflightTaskDefinition: { Value: !Ref WorkerTaskDefinition }
  TaskSecurityGroupId: { Value: !Ref TaskSecurityGroup }
  ApplicationSubnets: { Value: !Join [",", !Ref ApplicationSubnetIds] }
  ApplicationUrl: { Value: !Sub "https://${ApplicationHostname}" }
  ClusterName: { Value: !Ref Cluster }
  WebServiceName: { Value: !GetAtt WebService.Name }
  WorkerServiceName: { Value: !GetAtt WorkerService.Name }
  DatabaseIdentifier: { Value: !Ref Database }
  DatabaseSecretArn: { Value: !Ref DatabaseSecret }
  AlbLogBucketName: { Value: !Ref AlbLogBucket }
