apiVersion: v1
kind: Service
metadata: { name: {{ include "blakdna.fullname" . }} }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ include "blakdna.name" . }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }]
