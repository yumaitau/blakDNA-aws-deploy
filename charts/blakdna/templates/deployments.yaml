apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "blakdna.fullname" . }}-web }
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "blakdna.name" . }}, app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "blakdna.name" . }}, app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: web } }
    spec:
      serviceAccountName: {{ required "A buyer-provisioned IRSA serviceAccount.name is required" .Values.serviceAccount.name }}
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ include "blakdna.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000, protocol: TCP }]
          env:
            {{- include "blakdna.environment" . | nindent 12 }}
          startupProbe: { httpGet: { path: /api/health, port: http }, failureThreshold: 36, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "blakdna.fullname" . }}-worker }
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "blakdna.name" . }}, app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "blakdna.name" . }}, app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: worker } }
    spec:
      serviceAccountName: {{ required "A buyer-provisioned IRSA serviceAccount.name is required" .Values.serviceAccount.name }}
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: {{ include "blakdna.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [node, dist/worker.cjs]
          env:
            {{- include "blakdna.environment" . | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
